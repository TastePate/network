{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}Social Network{% endblock %}</title>
        <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>
        <link href="{% static 'network/styles.css' %}" rel="stylesheet">
    </head>
    <body>
        <div
                class="body"
                data-authenticated-user-id="{{ user.id }}"
                data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
                data-username="{{ user.username }}"
                data-logo-url="{% static 'network/logo.png' %}">
            {% block body %}
            {% endblock %}
        </div>
    </body>
</html>
